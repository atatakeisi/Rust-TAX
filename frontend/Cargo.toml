[package]
name = "rust_tax_web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust_tax_engine = { path = "../engine" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "Event", "EventTarget", "Node", "NodeList", "DomTokenList", "Storage", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

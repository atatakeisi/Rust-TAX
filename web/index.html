<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>TikTokライバー 税金・国保・親の扶養 一撃診断＆確定申告台帳 | Rust</title>
  <meta name="description" content="Rust / WebAssembly で動く税金・国保・親の扶養の概算診断と端末内保存の台帳。" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app"><p role="status" style="padding:2rem">Rust アプリを読み込んでいます…</p></main>
  <noscript>このアプリには JavaScript と WebAssembly の有効化が必要です。</noscript>
  <script type="module">
    try {
      const { default: init } = await import('./pkg/rust_tax_web.js');
      await init();
    } catch (error) {
      console.error(error);
      document.getElementById('app').textContent = 'アプリを読み込めませんでした。ページを再読み込みしてください。ローカルの場合は npm run build 後、HTTP サーバーから開いてください。';
    }
  </script>
</body>
</html>
